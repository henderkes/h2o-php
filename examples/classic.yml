listen: 18103
num-threads: 2
send-informational: all
php.runtime:
  threads: 2
  max-threads: 8
  request-timeout: 5s
php.root: examples/smoke
php.ini:
  output_buffering: 0
hosts:
  "localhost:18103":
    paths:
      "/":
        file.dir: examples/smoke
        file.index: [index.php, index.html]
        file.custom-handler:
          extension: .php
