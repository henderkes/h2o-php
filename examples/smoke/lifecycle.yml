listen: 18086
num-threads: 2
php.runtime:
  threads: 2
  max-threads: 8
  request-timeout: 2s
  shutdown-timeout: 3s
php.root: /home/m/h2o-php/examples/smoke
php.ini:
  display_errors: 0
  output_buffering: 0
  session.save_path: /tmp
  opcache.revalidate_freq: 0
hosts:
  "localhost:18086":
    paths:
      "/worker":
        php.worker:
          file: /home/m/h2o-php/examples/smoke/worker-probe.php
          num: 1
          max-requests: 20
      "/metrics":
        php.metrics: ON
      "/":
        file.dir: /home/m/h2o-php/examples/smoke
