listen: 18080
num-threads: 2
send-informational: all
php.runtime:
  threads: 2
  max-threads: 16
  request-timeout: 5s
php.root: examples/smoke
php.ini:
  display_errors: 1
  output_buffering: 0
hosts:
  "localhost:18080":
    paths:
      "/worker":
        php.worker:
          file: worker.php
          num: 1
          max-requests: 100
          watch:
            - examples/smoke/worker.php
      "/metrics":
        php.metrics: ON
      "/restart":
        php.restart: ON
      "/":
        file.dir: examples/smoke
        file.custom-handler:
          extension: .php
  "second:18080":
    paths:
      "/": {}
