listen: 18107
num-threads: 2
send-informational: all
php.runtime:
  threads: 2
  max-threads: 8
  request-timeout: 5s
php.root: examples/smoke
php.ini:
  output_buffering: 0
hosts:
  "localhost:18107":
    paths:
      "/worker":
        php.worker:
          file: worker.php
          num: 1
      "/mounted": {}
      "/upstream":
        file.file: examples/smoke/static.txt
      "/proxy":
        proxy.reverse.url: http://127.0.0.1:18107/upstream
      "/":
        file.dir: examples/smoke
        file.index: [index.php, index.html]
        file.custom-handler:
          extension: .php
