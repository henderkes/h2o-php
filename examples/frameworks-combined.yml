listen:
  - host: 127.0.0.1
    port: 18084
  - host: 127.0.0.1
    port: 18085
num-threads: 2
php.runtime:
  threads: 2
  max-threads: 16
  request-timeout: 10s
php.ini:
  opcache.enable: "1"
  opcache.validate_timestamps: "0"
hosts:
  "symfony.local:18084":
    paths:
      "/":
        php.root: ../symfony-demo/public
        php_server:
          worker:
            file: index.php
            num: 1
            env:
              APP_ENV: prod
              APP_DEBUG: "0"
              APP_RUNTIME_OPTIONS: '{"error_handler":false}'
      "/metrics":
        php.metrics: ON
  "laravel.local:18085":
    paths:
      "/":
        php.root: build/frameworks/laravel/public
        php.worker:
          file: ../vendor/laravel/octane/bin/frankenphp-worker.php
          num: 1
          env:
            APP_BASE_PATH: !env APP_BASE_PATH
            APP_ENV: production
            APP_DEBUG: "false"
            SESSION_DRIVER: array
            CACHE_STORE: array
            LOG_CHANNEL: stderr
            MAX_REQUESTS: "1000"
