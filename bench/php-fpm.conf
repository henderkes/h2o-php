[global]
daemonize = no
error_log = /home/m/h2o-php/bench/raw/php-fpm-server.log
pid = /home/m/h2o-php/build/php-fpm.pid

[benchmark]
listen = 127.0.0.1:19000
pm = static
pm.max_children = 4
pm.max_requests = 10000
catch_workers_output = yes
clear_env = no
chdir = /home/m/h2o-php/examples/bench
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.enable_cli] = 1
php_admin_value[opcache.jit] = off
